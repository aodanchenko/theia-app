<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theia app styles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Courier+Prime:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:#e6e3dd;-webkit-font-smoothing:antialiased;font-synthesis:none}
body{min-height:100vh;padding:40px 16px 120px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#stage{display:flex;justify-content:center}
.pair{display:flex;gap:56px;flex-wrap:wrap;justify-content:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:14px}
.slot>p{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#5b5852}
.slot>p b{color:#22201c;font-weight:600}
.phone{position:relative;width:360px;height:760px;border-radius:48px;overflow:hidden;background:var(--bg);color:var(--ink);
  box-shadow:0 0 0 10px #151515,0 0 0 11px #2a2a2a,0 30px 60px -20px rgba(0,0,0,.45)}
.status{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:600 14px/1 -apple-system,sans-serif;color:#fff;z-index:9}
.status i{width:18px;height:10px;border-radius:3px;border:1.5px solid currentColor;position:relative}
.status i::after{content:"";position:absolute;inset:1.5px;right:4px;background:currentColor;border-radius:1px}
.cam{position:absolute;left:0;right:0;top:0;overflow:hidden;background:#222}
.cam svg{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.press{transition:transform 150ms ease-out}.press:active{transform:scale(.97)}

/* palettes from the two settings */
.earth{--bg:#f3eee4;--ink:#1c1a17;--muted:#625a4e;--rule:#d8cfbf;--warn:#b4560f;--good:#2f7a4b;font-family:"Atkinson Hyperlegible",sans-serif}
.space{--bg:#0e131a;--ink:#e8ecf1;--muted:#8796a8;--rule:#243040;--warn:#f2c230;--good:#6fcf97;font-family:"IBM Plex Mono",monospace}
.space.paper{--bg:#f1efe8;--ink:#111;--muted:#5d5a52;--rule:#cfcabd}
.tab{font-variant-numeric:tabular-nums}

/* motion: entrances only, transform/opacity, once */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateX(var(--from))}to{transform:none}}
.in{animation:rise 320ms cubic-bezier(.23,1,.32,1) both}
.d1{animation-delay:90ms}.d2{animation-delay:180ms}.d3{animation-delay:270ms}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 480ms cubic-bezier(.23,1,.32,1) 220ms both}
.bubble{animation:slide 700ms cubic-bezier(.23,1,.32,1) 200ms both}
@media (prefers-reduced-motion:reduce){.in,.pop,.bubble{animation:none!important}}

/* ===== 1 · Procedure ===== */
.v1 .cam{height:520px}
.v1 .live{position:absolute;top:52px;left:20px;z-index:3;font:600 12px/1 "IBM Plex Mono",monospace;color:#fff;letter-spacing:.1em;display:flex;gap:8px;align-items:center}
.v1 .live::before{content:"";width:8px;height:8px;border-radius:50%;background:#e5484d}
.v1 .doc{position:absolute;top:520px;left:0;right:0;bottom:0;background:var(--bg);padding:18px 22px 30px;display:flex;flex-direction:column}
.earth.v1 .stepline{display:flex;gap:16px;align-items:flex-start}
.earth.v1 .no{flex:none;width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:28px;font-weight:700}
.earth.v1 h2{font-size:32px;line-height:1.08}
.earth.v1 .why{font-size:19px;line-height:1.35;color:var(--muted);margin-top:6px}
.earth.v1 .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:19px;border-top:2px solid var(--ink);padding-top:12px}
.earth.v1 .foot button{font-weight:700;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.space.v1 .proc{font-size:13px;font-weight:600;border-bottom:2px solid var(--ink);padding-bottom:6px;display:flex;justify-content:space-between}
.space.v1 .caution{margin-top:12px;padding:3px;background:repeating-linear-gradient(-45deg,#111 0 8px,var(--warn) 8px 16px)}
.space.v1 .caution div{background:var(--bg);padding:8px 10px}
.space.v1 .caution b{font:700 18px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em}
.space.v1 .caution p{font-size:13px;margin-top:4px}
.space.v1 ol{margin-top:12px;padding-left:22px;font-size:14px;line-height:1.5}
.space.v1 ol li::marker{font-weight:600}
.space.v1 .meta{margin-top:auto;font-size:11px;color:var(--muted);border-top:1px solid var(--rule);padding-top:8px}

/* ===== 2 · On the body ===== */
.v2 .cam{inset:0}
.earth.v2 .say{position:absolute;top:58px;left:16px;right:16px;z-index:3;background:var(--bg);border-radius:22px;padding:16px 18px}
.earth.v2 .say p{font-size:30px;line-height:1.08;font-weight:700}
.earth.v2 .say small{display:block;font-size:18px;color:var(--muted);margin-top:6px}
.earth.v2 .count{position:absolute;left:22px;bottom:34px;z-index:3;color:#fff;font-weight:700;line-height:.85}
.earth.v2 .count b{font-size:96px;display:block}
.earth.v2 .count span{font-size:22px;opacity:.85}
.earth.v2 .stop{position:absolute;right:22px;bottom:34px;z-index:3;width:84px;height:84px;border-radius:50%;background:var(--bg);color:var(--ink);font-size:18px;font-weight:700}
.space.v2 .bar{position:absolute;top:50px;left:18px;right:18px;z-index:3;display:flex;justify-content:space-between;font-size:11px;color:#fff;letter-spacing:.08em}
.space.v2 .cue{position:absolute;left:18px;right:18px;bottom:30px;z-index:3;color:#fff}
.space.v2 .cue b{font:700 34px/1 "Barlow Condensed",sans-serif;letter-spacing:.03em;color:var(--warn)}
.space.v2 .cue p{font-size:12px;margin-top:8px;line-height:1.5;color:#cfd8e3}

/* ===== 3 · Level ===== */
.v3 .cam{height:500px}
.v3 .panel{position:absolute;top:500px;left:0;right:0;bottom:0;background:var(--bg);padding:22px 22px 30px;display:flex;flex-direction:column;gap:14px}
.earth.v3 .cue{font-size:28px;line-height:1.1;font-weight:700}
.earth.v3 .tube{position:relative;height:56px;border-radius:28px;background:#e6dcc8;box-shadow:inset 0 0 0 2px var(--ink)}
.earth.v3 .tube::before,.earth.v3 .tube::after{content:"";position:absolute;top:8px;bottom:8px;width:2px;background:var(--ink)}
.earth.v3 .tube::before{left:calc(50% - 30px)}.earth.v3 .tube::after{left:calc(50% + 28px)}
.earth.v3 .tube i{position:absolute;top:10px;left:calc(50% - 26px - 70px);width:52px;height:36px;border-radius:18px;background:var(--warn);--from:70px}
.earth.v3 .scale{display:flex;justify-content:space-between;font-size:18px;color:var(--muted)}
.earth.v3 .scale b{color:var(--ink)}
.earth.v3 .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:19px}
.space.v3 .head{display:flex;justify-content:space-between;align-items:baseline}
.space.v3 .head b{font:700 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em}
.space.v3 .head span{font-size:11px;color:var(--muted)}
.space.v3 .gauge svg{display:block;width:100%}
.space.v3 .read{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);padding-top:10px;font-size:11px;color:var(--muted)}
.space.v3 .read b{display:block;font-size:17px;color:var(--ink);font-weight:500;margin-top:3px}
.space.v3 .read .w b{color:var(--warn)}

/* ===== 4 · Ledger: 1970s NASA printout / terminal spreadsheet, NASA palette ===== */
.v4{--nred:#fc3b30;--nblue:#0062b3;--ngrey:#a8a8a9;--ngrey2:#b0b1b3;--nblack:#000815}
.v4 .cam{height:430px}
.v4 .sheet{position:absolute;top:430px;left:0;right:0;bottom:0}
/* Earth: plain and accessible: one sentence, one button */
.earth.v4 .sheet{background:#fff;color:var(--nblack);padding:22px 22px 30px;display:flex;flex-direction:column;gap:10px}
.earth.v4 .rep{font-size:22px;color:#4a4f58}
.earth.v4 .rep b{color:var(--nblack)}
.earth.v4 .cue{font-size:34px;line-height:1.1;font-weight:700}
.earth.v4 .why{font-size:21px;line-height:1.35;color:#4a4f58}
.earth.v4 .stop{margin-top:auto;height:68px;border-radius:18px;background:var(--nred);color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px}
.earth.v4 .stop i{width:18px;height:18px;background:#fff;border-radius:3px}
/* Space: terminal spreadsheet on NASA black */
.space.v4 .cam::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(rgba(0,8,21,.3) 0 1px,transparent 1px 3px)}
.space.v4 .sheet{background:var(--nblack);color:var(--ngrey2);font:20px/1 "VT323",monospace}
.space.v4 .fx{display:flex;border-bottom:1px solid #2a2f3a;height:34px;align-items:center}
.space.v4 .fx span{width:46px;text-align:center;border-right:1px solid #2a2f3a;height:100%;display:grid;place-items:center;color:var(--ngrey)}
.space.v4 .fx code{font:inherit;padding:0 8px;white-space:nowrap;overflow:hidden;color:#fff}
.space.v4 table{width:100%;border-collapse:collapse}
.space.v4 th{font-weight:400;background:var(--nblue);color:#fff;height:24px}
.space.v4 td{border:1px solid #2a2f3a;height:30px;padding:0 6px;white-space:nowrap}
.space.v4 td:first-child{width:28px;text-align:center;color:var(--ngrey)}
.space.v4 tr.sel td:not(:first-child){background:var(--nred);color:#fff}
.space.v4 .out{display:flex;justify-content:space-between;align-items:center;padding:12px 10px 0;font-size:30px;color:#fff}
.space.v4 .out small{font-size:18px;color:var(--ngrey)}
.space.v4 .cursor{display:inline-block;width:12px;height:22px;background:var(--nred);vertical-align:-3px;margin-left:4px}

/* ===== 2b · Space workbench in a tablet ===== */
.tablet{position:relative;width:940px;height:640px;border-radius:30px;overflow:hidden;background:#f3f3f3;color:#1d1f23;font-family:"IBM Plex Sans",sans-serif;font-size:12px;
  box-shadow:0 0 0 14px #151515,0 0 0 15px #2a2a2a,0 30px 60px -20px rgba(0,0,0,.45);display:grid;grid-template-rows:26px 34px 1fr 26px 24px}
.wb{--blue:#0062b3;--red:#fc3b30;--grid:#d4d4d6;--head:#e9e9eb;--mute:#6b6e75}
.wb .mono,.wb td,.wb .fx code{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.wb .menu{display:flex;gap:16px;align-items:center;padding:0 14px;background:#fff;border-bottom:1px solid var(--grid)}
.wb .menu b{font-weight:600;margin-right:6px}
.wb .menu span{color:#3a3d43}.wb .menu .r{margin-left:auto;color:var(--mute)}
.wb .tools{display:flex;gap:6px;align-items:center;padding:0 10px;border-bottom:1px solid var(--grid)}
.wb .tb{height:24px;padding:0 10px;border:1px solid var(--grid);border-radius:3px;background:#fff;display:flex;align-items:center;gap:6px}
.wb .tb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.wb .tb .led{width:7px;height:7px;border-radius:50%;background:var(--red)}
.wb .sep{width:1px;height:18px;background:var(--grid);margin:0 4px}
.wb .main{display:grid;grid-template-columns:520px 1fr;min-height:0}
.wb .view{position:relative;background:#111;border-right:1px solid var(--grid)}
.wb .view .cam{inset:0;position:absolute}
.wb .view .banner{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font:700 15px/1 "IBM Plex Mono",monospace;padding:7px 10px;letter-spacing:.04em}
.wb .view .cap{position:absolute;right:10px;top:10px;color:#fff;font:11px/1.4 "IBM Plex Mono",monospace;text-align:right;opacity:.85}
.wb .right{display:grid;grid-template-rows:26px auto auto 1fr;min-height:0;background:#fff}
.wb .fx{display:flex;border-bottom:1px solid var(--grid)}
.wb .fx span{width:44px;border-right:1px solid var(--grid);display:grid;place-items:center;color:var(--mute)}
.wb .fx i{width:26px;border-right:1px solid var(--grid);display:grid;place-items:center;font-style:italic;color:var(--mute)}
.wb .fx code{padding:0 8px;display:flex;align-items:center;font-size:12px}
.wb table{width:100%;border-collapse:collapse}
.wb th{background:var(--head);font-weight:500;color:var(--mute);height:20px;border:1px solid var(--grid);font-size:11px}
.wb td{border:1px solid var(--grid);height:22px;padding:0 6px;font-size:12px;white-space:nowrap}
.wb td:first-child{background:var(--head);color:var(--mute);text-align:center;width:24px;font-size:11px}
.wb td.n{text-align:right}
.wb tr.hd td:not(:first-child){font-weight:600;font-family:"IBM Plex Sans",sans-serif}
.wb tr.flag td:not(:first-child){color:var(--red);font-weight:600}
.wb td.sel{box-shadow:inset 0 0 0 2px var(--blue)}
.wb .chart{padding:8px 10px;border-top:1px solid var(--grid);min-height:0}
.wb .chart p{font-weight:600;margin-bottom:2px}
.wb .chart svg{display:block;width:100%}
.wb .sbar{display:flex;gap:18px;align-items:center;padding:0 12px;background:var(--blue);color:#fff;font:11px/1 "IBM Plex Mono",monospace}
.wb .sbar .r{margin-left:auto}
.wb .sheets{display:flex;align-items:stretch;background:var(--head);border-top:1px solid var(--grid)}
.wb .sheets span{padding:0 14px;display:flex;align-items:center;border-right:1px solid var(--grid);color:var(--mute)}
.wb .sheets span.on{background:#fff;color:#1d1f23;font-weight:600;border-bottom:2px solid var(--blue)}

.wb .vitals{border-top:1px solid var(--grid);padding:6px 10px 8px}
.wb .vitals p{font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between}
.wb .vitals p span{font-weight:400;color:var(--mute);font-family:"IBM Plex Mono",monospace;font-size:10px}
.wb .vg{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--grid);border:1px solid var(--grid)}
.wb .vg div{background:#fff;padding:4px 6px;display:grid;grid-template-columns:1fr auto;align-items:end;row-gap:1px}
.wb .vg small{grid-column:1/3;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.wb .vg b{font:500 15px/1 "IBM Plex Mono",monospace}
.wb .vg b u{text-decoration:none;font-size:10px;color:var(--mute);margin-left:2px}
.wb .vg .hi b{color:var(--red)}
.wb .vg svg{width:58px;height:16px}
/* picker: verbatim from PICKER.md */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
</style>
</head>
<body>
<main id="stage"></main>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Procedure</button>
  <button class="proto-picker-item">On the body</button>
  <button class="proto-picker-item">Level</button>
  <button class="proto-picker-item">Ledger</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>
<script>
// Person mid-squat, front view. Right knee (screen right) drifts inward.
const P={head:[180,118],neck:[180,150],ls:[142,170],rs:[218,170],le:[124,226],re:[236,226],lw:[156,250],rw:[204,250],lh:[158,296],rh:[202,296],lk:[126,372],rk:[192,378],la:[138,462],ra:[222,462]};
const BONES=[['neck','ls'],['neck','rs'],['ls','le'],['le','lw'],['rs','re'],['re','rw'],['ls','lh'],['rs','rh'],['lh','rh'],['lh','lk'],['lk','la'],['rh','rk'],['rk','ra']];
let uid=0;

// The camera: a soft, grainy video-like frame with a sharp skeleton on top.
function camera(app,h,o={}){
  const W=o.w||360;
  const id='c'+(uid++), earth=app==='earth', vis=o.vis||h;
  const s=Math.min(1.08,(vis-70-24)/390), tx=W/2-180*s, ty=70-91*s, floor=ty+470*s;
  const wall=earth?['#b9ab95','#8f8270']:['#4a5462','#2a313b'], ground=earth?'#7d715f':'#22282f', body=earth?'#4b4236':'#141a22';
  const bone='rgba(255,255,255,.8)', warn=o.warn||(earth?'#f0a24a':'#f2c230');
  const L=(a,b,w,c)=>`<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const person=BONES.map(([a,b])=>L(a,b,30,body)).join('')+`<path d="M142 170L218 170L202 296L158 296Z" fill="${body}"/><circle cx="180" cy="118" r="27" fill="${body}"/>`;
  const skel=BONES.map(([a,b])=>L(a,b,1.4,bone)).join('')+Object.entries(P).filter(([k])=>k!=='head').map(([,[x,y]])=>`<circle cx="${x}" cy="${y}" r="2.6" fill="${bone}"/>`).join('');
  const knee=L('rh','rk',2.4,warn)+L('rk','ra',2.4,warn)+`<circle class="pop" cx="${P.rk[0]}" cy="${P.rk[1]}" r="14" fill="none" stroke="${warn}" stroke-width="2"/>`;
  const guide=o.guide?`<line x1="${P.rh[0]+14}" y1="${P.rh[1]}" x2="${P.ra[0]}" y2="${P.ra[1]}" stroke="${warn}" stroke-width="1.4" stroke-dasharray="4 5"/>`:'';
  const arrow=o.arrow?`<g class="pop"><path d="M${P.rk[0]+20} ${P.rk[1]}h44" stroke="${warn}" stroke-width="5" stroke-linecap="round"/><path d="M${P.rk[0]+56} ${P.rk[1]-12}l14 12-14 12" fill="none" stroke="${warn}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>`:'';
  const tag=(x,y,t,c='#fff')=>`<g class="pop"><rect x="${x}" y="${y-13}" width="${t.length*7.4+12}" height="20" rx="3" fill="rgba(14,19,26,.78)"/><text x="${x+6}" y="${y+1}" font-family="IBM Plex Mono" font-size="12" fill="${c}">${t}</text></g>`;
  const tags=o.tags?tag(P.rk[0]+20,P.rk[1]+4,'KNEE 9°',warn)+tag(P.rh[0]+16,P.rh[1]-6,'HIP 94°')+tag(P.rs[0]+16,P.rs[1]+30,'TRUNK 4°'):'';
  const rule=o.ruler?`<g stroke="#fff" opacity=".7">${Array.from({length:17},(_,i)=>`<line x1="${i%4?8:0}" x2="16" y1="${ty+P.head[1]*s+i*22}" y2="${ty+P.head[1]*s+i*22}"/>`).join('')}</g><path d="M18 ${ty+P.rh[1]*s}l10-6v12z" fill="${warn}"/>`:'';
  const br=o.brackets?(()=>{const m=22,l=26,H=vis;return `<g stroke="#fff" stroke-width="2.5" fill="none" opacity=".9"><path d="M${m} ${m+40+l}v-${l}h${l}"/><path d="M${W-m-l} ${m+40}h${l}v${l}"/><path d="M${m} ${H-m-l}v${l}h${l}"/><path d="M${W-m-l} ${H-m}h${l}v-${l}"/></g>`})():'';
  return `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Camera: person squatting, right knee moving inward">
  <defs>
    <linearGradient id="${id}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${wall[0]}"/><stop offset="1" stop-color="${wall[1]}"/></linearGradient>
    <radialGradient id="${id}v" cx=".5" cy=".42" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
    <filter id="${id}b"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="${id}n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0"/></filter>
  </defs>
  <rect width="${W}" height="${h}" fill="url(#${id}w)"/><rect y="${floor}" width="${W}" height="${h}" fill="${ground}"/>
  <g transform="translate(${tx},${ty}) scale(${s})"><g filter="url(#${id}b)" opacity=".92">${person}</g>${guide}${skel}${knee}${arrow}${tags}</g>
  <rect width="${W}" height="${h}" fill="url(#${id}v)"/><rect width="${W}" height="${h}" filter="url(#${id}n)" opacity=".22"/>
  ${rule}${br}</svg>`;
}
const status=`<div class="status"><span class="tab">9:41</span><i></i></div>`;
const pair=(e,s)=>`<section class="pair"><div class="slot"><p><b>Earth</b> · rehab at home</p>${e}</div><div class="slot"><p><b>Space</b> · ISS, ARED squat${s.includes('tablet')?' · tablet':''}</p>${s}</div></section>`;

// Precision scale: −15°…+15°, baseline band, rehab threshold, needle at 9° inward.
function gauge(){
  const x=d=>158+d*9.6; let t='';
  for(let d=-15;d<=15;d++)t+=`<line x1="${x(d)}" x2="${x(d)}" y1="${d%5?34:26}" y2="44" stroke="#8796a8" stroke-width="1"/>`;
  return `<svg viewBox="0 0 316 86" role="img" aria-label="Knee valgus 9 degrees, baseline 3, rehab threshold 6">
  <rect x="${x(1)}" y="20" width="${x(5)-x(1)}" height="28" fill="rgba(111,207,151,.18)"/>${t}
  <line x1="${x(6)}" x2="${x(6)}" y1="14" y2="50" stroke="#f2c230" stroke-dasharray="3 3"/>
  <text x="${x(6)}" y="10" text-anchor="middle" font-size="9" fill="#f2c230" font-family="IBM Plex Mono">REHAB 6°</text>
  <g class="bubble" style="--from:-86px"><path d="M${x(9)} 18l-6-10h12z" fill="#f2c230"/><line x1="${x(9)}" x2="${x(9)}" y1="18" y2="52" stroke="#f2c230" stroke-width="2"/></g>
  ${[-15,-10,-5,0,5,10,15].map(d=>`<text x="${x(d)}" y="66" text-anchor="middle" font-size="10" fill="#8796a8" font-family="IBM Plex Mono">${Math.abs(d)}</text>`).join('')}
  <text x="${x(-15)}" y="82" font-size="9" fill="#8796a8" font-family="IBM Plex Mono">OUT</text><text x="${x(15)}" y="82" text-anchor="end" font-size="9" fill="#8796a8" font-family="IBM Plex Mono">IN</text>
  <text x="${x(3)}" y="82" text-anchor="middle" font-size="9" fill="#6fcf97" font-family="IBM Plex Mono">BASE 3°</text></svg>`;
}

function spark(seed,up){let y=8,pts=[];for(let i=0;i<12;i++){y+=((Math.sin(seed*7+i*1.9)+(up?.35:-.15))*2.2);y=Math.max(2,Math.min(14,y));pts.push(`${i*5},${16-y}`)}return `<svg viewBox="0 0 56 16"><polyline points="${pts.join(' ')}" fill="none" stroke="${up?'#fc3b30':'#0062b3'}" stroke-width="1.4"/></svg>`;}
function vitals(){
  const t=[['Heart rate','128','bpm',1,1],['HRV rMSSD','38','ms',2,1],['SpO2','97','%',3,0],['Resp rate','24','/min',4,0],['Core temp','37.1','°C',5,0],['BP (cuff, pre-set)','131/84','',6,0]];
  return `<div class="vitals in d2"><p>Vitals<span>SIMULATED · base: personal, 14 sessions</span></p><div class="vg">${t.map(([n,v,u,k,hi])=>`<div class="${hi?'hi':''}"><small>${n}</small><b>${v}<u>${u}</u></b>${spark(k,hi)}</div>`).join('')}</div></div>`;
}
function valgusChart(){
  const v=[2,3,3,4,5,7,9], X=i=>34+i*28, Y=d=>116-d*8.4;
  const bars=v.map((d,i)=>`<rect x="${X(i)-9}" y="${Y(d)}" width="18" height="${116-Y(d)}" fill="${d>=6?'#fc3b30':'#a8a8a9'}"/>`).join('');
  const empty=[7,8,9].map(i=>`<rect x="${X(i)-9}" y="${Y(.3)}" width="18" height="3" fill="#d4d4d6"/>`).join('');
  const lbl=Array.from({length:10},(_,i)=>`<text x="${X(i)}" y="130" text-anchor="middle">${i+1}</text>`).join('');
  return `<svg viewBox="0 0 400 140" font-family="IBM Plex Mono" font-size="9" fill="#6b6e75" role="img" aria-label="Right knee valgus per rep">
  <rect x="20" y="${Y(4)}" width="300" height="${Y(2)-Y(4)}" fill="rgba(45,160,90,.12)"/><text x="324" y="${Y(3)+3}" fill="#2a8a52">BASELINE 2–4°</text>
  <line x1="20" x2="320" y1="${Y(6)}" y2="${Y(6)}" stroke="#fc3b30" stroke-dasharray="4 3"/><text x="324" y="${Y(6)+3}" fill="#fc3b30">REHAB MODEL 6°</text>
  <line x1="20" x2="320" y1="${Y(10)}" y2="${Y(10)}" stroke="#6b6e75" stroke-dasharray="2 3"/><text x="324" y="${Y(10)+3}">BASE MODEL 10°</text>
  <line x1="20" x2="320" y1="116" y2="116" stroke="#d4d4d6"/>${bars}${empty}${lbl}
  <path d="M${X(5)} ${Y(7)-6}v-8" stroke="#fc3b30"/><text x="${X(5)}" y="${Y(7)-17}" text-anchor="middle" fill="#fc3b30">FLAG</text>
  <text x="20" y="138">REP</text></svg>`;
}

// picker wiring: verbatim from PICKER.md
const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],replay=picker.querySelector('.proto-picker-replay');let current=0;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`;}
function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();});}
function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current');});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i);}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay?.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current);});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
