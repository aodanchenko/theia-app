<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theia favicon</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#e6e3dd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#22201c;padding:40px 16px 80px;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
section{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
section p{font-size:13px;line-height:1.45;color:#5b5852;margin-top:6px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:flex-end;height:44px;padding:0 10px;border-radius:10px 10px 0 0}
.bar.light{background:#dee1e6}.bar.dark{background:#202124}
.tab{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px 9px 0 0;font-size:12px;min-width:200px}
.light .tab.on{background:#fff;color:#202124}.dark .tab.on{background:#35363a;color:#e8eaed}
.light .tab.off{color:#45474a}.dark .tab.off{color:#9aa0a6}
.tab svg{width:16px;height:16px;flex:none}
.big{display:flex;gap:10px;align-items:center;margin-left:auto}
.big svg{width:32px;height:32px}
.big svg.x48{width:48px;height:48px}
</style>
</head>
<body>
<main id="m"></main>
<script>
const INK='#000815', RED='#fc3b30', BLUE='#0062b3';
// Each option is a function of the ink colour, so it can flip for dark tab bars.
const opts=[
 ['App icon, shrunk','The app icon as is: the same limb on a white rounded tile. Consistent, but busy at 16 px.',
  ink=>`<rect width="32" height="32" rx="7" fill="#fff"/><polyline points="12,7 21,16 13,25" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="16" r="4" fill="${RED}"/>`],
 ['Bold limb','Just the limb, thicker and bigger so it survives 16 px. No tile; follows the tab colour.',
  ink=>`<polyline points="10,4 22,16 11,28" fill="none" stroke="${ink}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="16" r="5.5" fill="${RED}"/>`],
 ['Three points','Only the three joints, no lines: hip, knee, ankle. Reads as "tracking" even at 16 px.',
  ink=>`<circle cx="11" cy="6" r="4" fill="${ink}"/><circle cx="22" cy="16" r="5.5" fill="${RED}"/><circle cx="12" cy="26" r="4" fill="${ink}"/>`],
 ['Knee','One red joint in a thin ring: the smallest possible version of the idea.',
  ink=>`<circle cx="16" cy="16" r="12" fill="none" stroke="${ink}" stroke-width="3"/><circle cx="16" cy="16" r="6" fill="${RED}"/>`],
 ['Blue tile','The limb in white on a NASA-blue tile: most visible in a crowded tab bar.',
  ink=>`<rect width="32" height="32" rx="7" fill="${BLUE}"/><polyline points="11,7 20,16 12,25" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="16" r="4.4" fill="${RED}" stroke="#fff" stroke-width="1.2"/>`],
];
const svg=(b,cls='')=>`<svg class="${cls}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
const bar=(mode,b)=>`<div class="bar ${mode}"><div class="tab on">${svg(b)}Theia</div><div class="tab off">${svg(`<circle cx="16" cy="16" r="10" fill="#9aa0a6"/>`)}Inbox (3)</div></div>`;
document.getElementById('m').innerHTML=opts.map(([n,d,f])=>`<section>
  <div><h2>${n}</h2><p>${d}</p></div>
  <div class="bars">${bar('light',f(INK))}${bar('dark',f('#e8eaed'))}
    <div class="big">${svg(f(INK))}${svg(f(INK),'x48')}</div></div>
</section>`).join('');
</script>
</body>
</html>
