<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theia favicon, round 2</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#e6e3dd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#22201c;padding:40px 16px 80px;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
section{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center}
@media (max-width:640px){section{grid-template-columns:1fr}}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
section p{font-size:13px;line-height:1.45;color:#5b5852;margin-top:6px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:flex-end;height:44px;padding:0 10px;border-radius:10px 10px 0 0;overflow:hidden}
.bar.light{background:#dee1e6}.bar.dark{background:#202124}
.tab{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:9px 9px 0 0;font-size:12px;min-width:200px}
.light .tab.on{background:#fff;color:#202124}.dark .tab.on{background:#35363a;color:#e8eaed}
.light .tab.off{color:#45474a}.dark .tab.off{color:#9aa0a6}
.tab svg{width:16px;height:16px;flex:none}
.big{display:flex;gap:10px;align-items:center;margin-left:auto}
.big svg{width:32px;height:32px}
.big svg.x48{width:48px;height:48px}
.big svg.x96{width:96px;height:96px}
</style>
</head>
<body>
<main id="m"></main>
<script>
const INK='#000815', RED='#fc3b30', PAPER='#f3eee4', GREEN='#33ff66';

// 1-bit pixel limb for the early-internet option: hip → knee → ankle on a 16×16 grid, 2 px stroke.
const px=(pts,c)=>{let s='';for(let k=0;k<pts.length-1;k++){let[x0,y0]=pts[k],[x1,y1]=pts[k+1];const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));
  for(let i=0;i<=n;i++){const x=Math.round(x0+(x1-x0)*i/n),y=Math.round(y0+(y1-y0)*i/n);s+=`<rect x="${x*2}" y="${y*2}" width="4" height="4" fill="${c}"/>`}}return s};

// Each option is a function of the ink colour, so line-only marks can flip for dark tab bars.
const opts=[
 ['Theta','Θ for Theia, cut like a Didone serif: thick sides, hairline top and bottom. The bar is the limb, the red dot the knee. Reads as a symbol from an equation.',
  ink=>`<rect width="32" height="32" rx="6" fill="${PAPER}"/><path fill-rule="evenodd" fill="${INK}" d="M16 2.5a9.5 13.5 0 1 0 0.01 0zM16 4.3a5.6 11.7 0 1 1-0.01 0z"/><rect x="9" y="15" width="14" height="2" fill="${INK}"/><circle cx="16" cy="16" r="3.4" fill="${RED}"/>`],
 ['Constellation','Hip, knee and ankle as a star chart on deep-space black. The knee is the red star. Space plus "we track points".',
  ink=>`<rect width="32" height="32" rx="6" fill="${INK}"/><polyline points="10,6 22,16 11,26" fill="none" stroke="#9fb3d1" stroke-width="1.2"/><path d="M10 2.5v7M6.5 6h7M11 22.5v7M7.5 26h7" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="22" cy="16" r="4.2" fill="${RED}"/><circle cx="27" cy="6" r="1" fill="#fff"/><circle cx="25" cy="27" r=".8" fill="#fff"/>`],
 ['Reticle','An instrument crosshair over the knee, like a registration mark on an old journal plate. No tile; follows the tab colour.',
  ink=>`<circle cx="16" cy="16" r="10" fill="none" stroke="${ink}" stroke-width="2.4"/><path d="M16 1v8M16 23v8M1 16h8M23 16h8" stroke="${ink}" stroke-width="2.4"/><circle cx="16" cy="16" r="4.2" fill="${RED}"/>`],
 ['1-bit CRT','Pixel limb in phosphor green on a black terminal, 1996 style. Sharp at 16 px because it is drawn on the 16 px grid.',
  ink=>`<rect width="32" height="32" fill="#050805"/>${px([[4,1],[10,7],[5,14]],GREEN)}<rect x="18" y="12" width="6" height="6" fill="${RED}"/>`],
 ['Figure plate','A journal figure: cream plate, ink frame, the limb as a line drawing with open circles at the joints. Most "scientific paper".',
  ink=>`<rect x="1.5" y="1.5" width="29" height="29" fill="${PAPER}" stroke="${INK}" stroke-width="2"/><polyline points="11,7 21,16 12,25" fill="none" stroke="${INK}" stroke-width="2.2"/><circle cx="11" cy="7" r="2.4" fill="${PAPER}" stroke="${INK}" stroke-width="1.8"/><circle cx="12" cy="25" r="2.4" fill="${PAPER}" stroke="${INK}" stroke-width="1.8"/><circle cx="21" cy="16" r="3.8" fill="${RED}"/>`],
 ['Orbit','The knee as a planet with a tilted orbit, drawn like a 1960s mission diagram. Space first, movement second.',
  ink=>`<ellipse cx="16" cy="16" rx="14" ry="6" transform="rotate(-28 16 16)" fill="none" stroke="${ink}" stroke-width="2"/><circle cx="16" cy="16" r="6.5" fill="${RED}"/><circle cx="27.5" cy="9.6" r="2.4" fill="${ink}"/>`],
];
const svg=(b,cls='')=>`<svg class="${cls}" viewBox="0 0 32 32" shape-rendering="${b.includes('width="4"')?'crispEdges':'auto'}" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
const bar=(mode,b)=>`<div class="bar ${mode}"><div class="tab on">${svg(b)}Theia</div><div class="tab off">${svg(`<circle cx="16" cy="16" r="10" fill="#9aa0a6"/>`)}Inbox (3)</div></div>`;
document.getElementById('m').innerHTML=opts.map(([n,d,f])=>`<section>
  <div><h2>${n}</h2><p>${d}</p></div>
  <div class="bars">${bar('light',f(INK))}${bar('dark',f('#e8eaed'))}
    <div class="big">${svg(f(INK))}${svg(f(INK),'x48')}${svg(f(INK),'x96')}</div></div>
</section>`).join('');
</script>
</body>
</html>
